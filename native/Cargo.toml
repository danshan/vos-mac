[workspace]
members = [
  "crates/open2jam-core",
  "crates/open2jam-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "Artistic-2.0"

[workspace.dependencies]
chardetng = "1.0.0"
encoding_rs = "0.8.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
symphonia = { version = "0.6.1", default-features = false, features = ["ogg", "vorbis"] }
